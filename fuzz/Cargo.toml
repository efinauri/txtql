[package]
name = "txtql-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
txtql = { path = ".." }

# Not part of the parent package's workspace.
[workspace]
members = ["."]

[lib]
path = "src/lib.rs"

[[bin]]
name = "smoke"
path = "src/smoke.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repro"
path = "src/repro.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_input"
path = "fuzz_targets/fuzz_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_run"
path = "fuzz_targets/fuzz_run.rs"
test = false
doc = false
bench = false
