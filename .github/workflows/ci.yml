name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Newer runs of the same ref supersede older ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast
      # Benches and the fuzz crate are not built by `cargo test`; make sure they still compile.
      - run: cargo check --benches --locked
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked

  docs:
    name: docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      # Re-runs every documented example against target/release/txtql and fails (exit 1)
      # if README.md / wiki/ differ from what the templates in tools/docs/src generate.
      - run: python3 tools/docs/gen.py --check

  allium:
    name: allium spec
    # Pinned CLI from crates.io (verified locally: exits 0, only info diagnostics).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install allium-cli --version 3.6.1 --locked
      - run: allium check txtql.allium spec/
      - run: allium analyse txtql.allium spec/
