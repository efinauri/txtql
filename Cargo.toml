[package]
name = "txtql"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
miette = { version = "7.6.0", features = ["fancy"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
stacker = "0.1.25"
thiserror = "2.0.21"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.48.0"
proptest = "1.11.0"

[[bench]]
name = "scaling"
harness = false
